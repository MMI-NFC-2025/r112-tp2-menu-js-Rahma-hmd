<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your language</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f4f4;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav ul li {
            margin: 15px 0;
        }

        a {
            display: inline-block;
            padding: 12px 22px;
            border: 2px solid #333;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 1.2rem;
            transition: 0.2s;
        }

        a:hover {
            background: #333;
            color: #fff;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>
                <a onclick="document.cookie='nf_lang=en;path=/';" href="/en/index.html">Home in English</a>
            </li>
            <li>
                <a onclick="document.cookie='nf_lang=fr;path=/';" href="/fr/index.html">Accueil en Français</a>
            </li>
        </ul>
    </nav>
</body>

</html>
